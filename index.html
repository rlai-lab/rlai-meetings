<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RLAI Seminars</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    body {
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.5;
      color: #222;
      background: #fff;
    }
    header { display: flex; align-items: center; gap: 12px; }
    header img { width: 44px; height: 44px; border-radius: 6px; }
    .topic { border-top: 1px solid #ddd; padding: 20px 0; }
    .topic h2 { font-size: 1.25em; margin: 0; }
    summary { cursor: pointer; color: #444; margin-top: 6px; }
    .abstract { margin: 8px 0 0; }
    .abstract p { margin: 0 0 10px; }
    .abstract ul { margin: 0 0 10px; padding-left: 20px; }
    .session { margin-top: 12px; }
    .session h3 { font-size: 1em; margin: 0; }
    .session .date { color: #666; font-weight: normal; }
    .session ul { margin: 4px 0 0; padding-left: 20px; }
    .session li { margin: 4px 0; }
    a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid #ccc;
      transition: color 0.15s, border-color 0.15s, background-color 0.15s;
    }
    a:hover { color: #6b5fb5; border-color: #6b5fb5; }
    a.slides:hover { background: #f1effa; }
    .slides {
      font-size: 0.8em;
      margin-left: 8px;
      padding: 1px 8px;
      border: 1px solid #ccc;
      border-radius: 10px;
      color: #444;
    }
  </style>
</head>
<body>
  <header>
    <img src="favicon.png" alt="RLAI logo">
    <h1>RLAI Seminars</h1>
  </header>

  <div id="topics"></div>

  <script>
    const list = document.getElementById("topics");
    const firstDate = t => t.meetings.map(m => m.date).sort()[0] || "";

    fetch("meetings.json")
      .then(r => r.json())
      .then(render)
      .catch(err => {
        list.textContent = "Could not load meetings.json: " + err.message;
      });

    const formatDate = d => new Date(d + "T00:00:00").toLocaleDateString("en-US", {
      weekday: "short", year: "numeric", month: "long", day: "numeric",
    });
    
    function renderAbstract(text) {
      const box = document.createElement("div");
      box.className = "abstract";
      let ul = null;
      for (const raw of text.split("\n")) {
        const line = raw.trim();
        const bullet = line.match(/^[-•]\s+(.*)/);
        if (bullet) {
          if (!ul) ul = box.appendChild(document.createElement("ul"));
          ul.appendChild(document.createElement("li")).textContent = bullet[1];
          continue;
        }
        ul = null;
        if (!line) continue;
        const p = box.appendChild(document.createElement("p"));
        if (line.endsWith(":") && line.length < 40) {
          p.appendChild(document.createElement("strong")).textContent = line;
        } else {
          p.textContent = line;
        }
      }
      return box;
    }

    function render(topics) {
      const sorted = [...topics].sort((a, b) => firstDate(b).localeCompare(firstDate(a)));
      for (const t of sorted) {
        const div = document.createElement("div");
        div.className = "topic";

        const title = document.createElement("h2");
        title.textContent = t.title;
        div.appendChild(title);

        if (t.abstract) {
          const details = document.createElement("details");
          const summary = document.createElement("summary");
          summary.textContent = "Abstract";
          details.append(summary, renderAbstract(t.abstract));
          div.appendChild(details);
        }

        const meetingsInOrder = [...t.meetings].sort((a, b) => a.date.localeCompare(b.date));
        meetingsInOrder.forEach((m, i) => {
          const session = document.createElement("div");
          session.className = "session";

          const h3 = document.createElement("h3");
          h3.textContent = `Meeting ${i + 1} `;
          const date = document.createElement("span");
          date.className = "date";
          date.textContent = "· " + formatDate(m.date);
          h3.appendChild(date);
          session.appendChild(h3);

          if (m.speakers && m.speakers.length) {
            const ul = document.createElement("ul");
            for (const s of m.speakers) {
              const li = document.createElement("li");
              if (s.website) {
                const name = document.createElement("a");
                name.href = s.website;
                name.textContent = s.name;
                li.appendChild(name);
              } else {
                li.textContent = s.name;
              }
              for (const [key, text] of [["slides", "Slides"], ["notes", "Notes"]]) {
                if (!s[key]) continue;
                const link = document.createElement("a");
                link.className = "slides";
                link.href = s[key];
                link.textContent = text;
                li.appendChild(link);
              }
              ul.appendChild(li);
            }
            session.appendChild(ul);
          }

          div.appendChild(session);
        });

        list.appendChild(div);
      }
    }
  </script>
</body>
</html>
